# Test path for the private (Zcash hop) withdraw: the SAME files as /stealth/, served cross-origin isolated.
# The Zcash wallet (WebAssembly threads) needs SharedArrayBuffer, which browsers give only to pages with COOP same-origin + COEP require-corp.
# Put this inside the app.deepyield.ai server { } block. The page keeps calling the same-origin API (/stealth-api/...), nothing else changes.
# Deploy: rsync web/ (including web/vendor/webzjs, built by ops/build_webzjs.sh and checked against its SHA256SUMS) to /var/www/stealth-zec/.
# Check: curl -sI https://app.deepyield.ai/stealth-zec/ | grep -i cross-origin  ->  3 headers; in the console: crossOriginIsolated === true.
# add_header is not inherited into a location that has its own add_header, so the wasm location repeats ALL the headers below (isolation + nosniff/referrer/framing).
# Audit 1158 F-9: no script-src CSP on purpose. The wallet page loads wasm threads (workers spawned from blob/inline glue) and vendor glue whose exact needs ('wasm-unsafe-eval',
# worker-src blob:, inline module bootstrap) are not verified in a browser here; a wrong script-src would break the wallet, so only frame-ancestors is set (the clickjacking half).
location ^~ /stealth-zec/ {
    root /var/www;                                                             # files at /var/www/stealth-zec/...
    index index.html;
    # audit 1163 I-3: no `types {}` / `include mime.types` here: the location inherits the http-level map (nginx.conf already includes mime.types), so no "duplicate extension" warning on versions whose mime.types lists wasm.
    # The wasm type is set where it matters, in the .wasm location below (empty types{} + default_type), independent of the version of mime.types.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
    add_header X-Content-Type-Options       "nosniff"      always;
    add_header Referrer-Policy              "no-referrer"  always;
    add_header Content-Security-Policy      "frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;                                # html/js revalidate: the app changes
    location ~ \.wasm$ {                                                       # 58 MB: cache hard (a new build = deploy under a new path, or purge)
        types { }                                                              # empty map: the only file type served here is wasm
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
        add_header X-Content-Type-Options       "nosniff"      always;
        add_header Referrer-Policy              "no-referrer"  always;
        add_header Content-Security-Policy      "frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";       # audit 1158 F-8: NO "always" -- only 200/204/206/301/302/304 are cached for a year, a 404/5xx during a deploy is not
    }
}
