# nginx http{} level, ONCE per host: one IPv6 /64 = one client (audit 1099 M-2 / 1102 M-1 / 1107 I-1; audit 1165 L-2: the Base zones key on it too). Written to conf.d by ops/install_rh.sh and ops/install_base.sh when no `map $remote_addr $st_ipkey` exists yet.
# Audit 1167 I-3 (accepted): the compressed forms are mapped only for a 7-group tail; other compressions (e.g. a::x:y:z:w:u) fall into the coarser rule, so two /64s can share a key or one /64 can show under two keys
# (a per-client limit up to 2x, never a bypass of the global limits). A complete map needs a rule per (prefix groups, zero run) pair and cannot be checked here without nginx -t.
map $remote_addr $st_ipkey {
  ~^::ffff:(?<v4>[0-9.]+)$                                                                  $v4;
  ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4}):(?<c>[0-9a-fA-F]{1,4}):(?<d>[0-9a-fA-F]{1,4}):  $a:$b:$c:$d;
  ~^(?<a>[0-9a-fA-F]{1,4})::(?<c>[0-9a-fA-F]{1,4}):(?<d>[0-9a-fA-F]{1,4}):[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$  $a:0:$c:$d;
  ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4})::(?<d>[0-9a-fA-F]{1,4}):[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$  $a:$b:0:$d;
  ~^::(?<b>[0-9a-fA-F]{1,4}):(?<c>[0-9a-fA-F]{1,4}):(?<d>[0-9a-fA-F]{1,4}):[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$  0:$b:$c:$d;
  ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4}):(?<c>[0-9a-fA-F]{1,4})::                  $a:$b:$c:0;
  ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4})::                                          $a:$b:0:0;
  ~^(?<a>[0-9a-fA-F]{1,4})::                                                                 $a:0:0:0;
  ~^::                                                                                       0:0:0:0;
  default $remote_addr;
}
