# Base Stealth: immutable history pages (written by the Base indexer with STEALTH_PAGES_DIR=/opt/stealth/data/pages).
# Include inside the same server { } as the existing Base `location /stealth-api/ { ... }`; the exact/longer prefixes below win over it.
# Python never serves pages: nginx only, precompressed .gz next to each file. Adjust the alias to the real Base data dir.
# Client: web/app.js fetches API + "/pages/manifest.json" then API + "/pages/p<k>.json?v=<version>" (API = "/stealth-api" on Base).

location = /stealth-api/pages/manifest.json {
    alias /opt/stealth/data/pages/manifest.json;
    limit_except GET { deny all; }
    default_type application/json;
    add_header Cache-Control "public, max-age=5" always;
}
location /stealth-api/pages/ {
    alias /opt/stealth/data/pages/;
    limit_except GET { deny all; }
    default_type application/json;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
