# Base (StealthPay v3) Stealth API behind nginx, NEW path /stealth-api/base/. The live Base API (/stealth-api/ -> 3873/3874, StealthPay v2) and RH (/stealth-api/rh/) are NOT touched.
# Include inside the existing `server { }` of app.deepyield.ai, next to the RH include (longest-prefix match: /stealth-api/base/ wins over /stealth-api/, as /stealth-api/rh/ does).
# Browser: web/chains.js  base.api = "/stealth-api/base"  -> app.js calls API + "/head", "/announcements", "/balances", "/relay", "/relay/pay", ...
# Upstreams: Base v3 indexer 127.0.0.1:3893, Base v3 relayer 127.0.0.1:3894 (3873/3874 = old Base, 3883/3884 = RH; 3893/3894 were free on the host, checked with ss -ltnp). The services match
# paths with endswith(), but we rewrite to the plain /stealth-api/... form anyway so every instance sees identical URLs.
# http{} level, once (ops/install_base.sh writes it to conf.d/stealth-base-zones.conf): own zones, so Base traffic never eats the RH budget; st_tail (the cache path) is shared and defined by the RH zones file.
#   limit_req_zone $binary_remote_addr zone=st_base_read:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=st_base_post:10m rate=10r/m;
#   limit_conn_zone $binary_remote_addr zone=st_base_conn:10m;
#   (limit_req_status 429; must exist once at http level, as for RH.) If the RH zones file gets the $st_ipkey map (see the header of stealth-rh.conf), key the three Base zones on it too.
# NOTE: behind Cloudflare enable realip as described in stealth-rh.conf, or every per-IP limit sees only the proxy. X-Forwarded-For is overwritten with $remote_addr below (audit 1160 M-2: the relayer
# reads the RIGHTMOST hop, only from the loopback proxy; keep `proxy_set_header X-Forwarded-For $remote_addr;` in EVERY relayer location, never $proxy_add_x_forwarded_for).

# relay POSTs (withdraw, pay): strict
location ~ ^/stealth-api/base/relay(/pay)?$ {
    limit_except POST { deny all; }
    limit_req zone=st_base_post burst=5 nodelay;
    limit_conn st_base_conn 10;
    client_max_body_size 8k;
    client_body_timeout 10s;
    rewrite ^/stealth-api/base/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3894;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 45s;                 # relayer does ~8 RPC calls before it answers; tx hash is returned right after send. Audit 1160 I-2: longer than the relayer's nonce-lock deadline (40 s)
    proxy_next_upstream off;                # NEVER retry a POST on another attempt
    add_header Cache-Control "no-store" always;
}

# relayer stats, sanctions pre-check (GET /stealth-api/base/relay/screen?addr=0x.. -> {"addr","listed"}) and replaced-tx follow-up (GET /stealth-api/base/relay/status?hash=0x.. -> {"hash","status"})
location ~ ^/stealth-api/base/relay/(stats|screen|status)$ {
    limit_except GET { deny all; }
    limit_req zone=st_base_read burst=40 nodelay;
    limit_conn st_base_conn 10;               # audit 1099 M-2
    proxy_hide_header Cache-Control;        # audit 1102 I-2: one Cache-Control only (the location's own)
    rewrite ^/stealth-api/base/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3894;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

# audit 1107 I-2: the sanctions list has its OWN location: the relayer's "public, max-age=300" reaches the browser (no hide_header / no-store here), so 5-minute caching works.
# st_base_read still limits it; nginx may additionally cache it for the same 5 minutes (proxy_cache with a zone defined at http{} level) if the relayer load matters.
location = /stealth-api/base/relay/sanctions-list {
    limit_except GET { deny all; }
    limit_req zone=st_base_read burst=40 nodelay;
    limit_conn st_base_conn 10;
    rewrite ^/stealth-api/base/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3894;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# immutable history pages written by the indexer (STEALTH_PAGES_DIR). Python never serves these: nginx only, precompressed .gz next to each file.
# Page files are never edited in place (a reorg rewrite bumps manifest "version"; the client appends ?v=<version>), hence "immutable".
location = /stealth-api/base/pages/manifest.json {
    alias /opt/stealth-base/data/pages/manifest.json;
    limit_except GET { deny all; }
    default_type application/json;
    add_header Cache-Control "public, max-age=5" always;
}
location /stealth-api/base/pages/ {
    alias /opt/stealth-base/data/pages/;
    limit_except GET { deny all; }
    default_type application/json;
    gzip_static on;                             # serves p000001.json.gz when the client sends Accept-Encoding: gzip
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# the history tail (rows after the last full page) is the only bulk thing Python still serves: 1 s micro-cache so 500 scanners cost ONE upstream hit/s.
#   http{}:  proxy_cache_path /var/cache/nginx/stealth_tail levels=1 keys_zone=st_tail:2m max_size=64m inactive=1m use_temp_path=off;
location = /stealth-api/base/announcements {
    limit_except GET { deny all; }
    limit_req zone=st_base_read burst=40 nodelay;
    rewrite ^/stealth-api/base/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3893;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache st_tail;
    proxy_cache_key $uri$is_args$args;
    proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_503;
    gzip on; gzip_types application/json; gzip_min_length 1024;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
}
# indexer reads (head, announcements, known, balances, receipt, usdc-domain)
location ~ ^/stealth-api/base/(head|known|balances|receipt|usdc-domain)$ {
    limit_except GET { deny all; }
    limit_req zone=st_base_read burst=40 nodelay;
    limit_conn st_base_conn 20;
    rewrite ^/stealth-api/base/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3893;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    proxy_next_upstream error timeout http_503;   # idempotent GETs only
    proxy_next_upstream_tries 2;
    add_header Cache-Control "no-store" always;
}

# anything else under /stealth-api/base/ is not an API
location /stealth-api/base/ { return 404; }
