# Robinhood Chain Stealth API behind nginx. Include inside the existing `server { }` of app.deepyield.ai
# (next to the Base `location /stealth-api/ { ... }` blocks; longest-prefix match makes /stealth-api/rh/ win over /stealth-api/).
# Browser:  web/chains.js  rh.api = "/stealth-api/rh"  -> app.js calls API + "/head", "/announcements", "/balances", "/relay", "/relay/pay", ...
# Upstreams: RH indexer 127.0.0.1:3883, RH relayer 127.0.0.1:3884. Services match paths with endswith(), but we rewrite to the plain
# /stealth-api/... form anyway so both instances see identical URLs.
#
# --- http{} level (put in conf.d/stealth-rh-zones.conf, once; skip a line if the Base config already defines the same zone name) ---
# Audit 1099 M-2: one IPv6 /64 is one customer. The map is part of the REQUIRED http{} config (not optional) and the three zones key on $st_ipkey, not $binary_remote_addr
# (compressed forms such as 2001:db8::1 fall back to the full address; the relayer additionally buckets every address by its /64 itself and has its own failure budgets).
# Audit 1102 M-1: nginx prints $remote_addr compressed, so the map must also handle "::" inside the first four groups (2001:db8:abcd::5 is the /64 2001:db8:abcd:0), and
# IPv4-mapped addresses are the IPv4 address (same as the relayer's ipKey()). Order matters (first matching regex wins).
# Audit 1107 I-1: nginx may also print "::" for a SINGLE zero group (1::2:3:4:5:6:7 = 1:0:2:3:...); the three 7-group rules below keep those /64s apart.
#   map $remote_addr $st_ipkey {
#     ~^::ffff:(?<v4>[0-9.]+)$                                                                  $v4;
#     ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4}):(?<c>[0-9a-fA-F]{1,4}):(?<d>[0-9a-fA-F]{1,4}):  $a:$b:$c:$d;
#     ~^(?<a>[0-9a-fA-F]{1,4})::(?<c>[0-9a-fA-F]{1,4}):(?<d>[0-9a-fA-F]{1,4}):[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$  $a:0:$c:$d;
#     ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4})::(?<d>[0-9a-fA-F]{1,4}):[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$  $a:$b:0:$d;
#     ~^::(?<b>[0-9a-fA-F]{1,4}):(?<c>[0-9a-fA-F]{1,4}):(?<d>[0-9a-fA-F]{1,4}):[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}$  0:$b:$c:$d;
#     ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4}):(?<c>[0-9a-fA-F]{1,4})::                  $a:$b:$c:0;
#     ~^(?<a>[0-9a-fA-F]{1,4}):(?<b>[0-9a-fA-F]{1,4})::                                          $a:$b:0:0;
#     ~^(?<a>[0-9a-fA-F]{1,4})::                                                                 $a:0:0:0;
#     ~^::                                                                                       0:0:0:0;
#     default $remote_addr;
#   }
#   limit_req_zone $st_ipkey zone=st_rh_read:10m  rate=10r/s;
#   limit_req_zone $st_ipkey zone=st_rh_post:10m  rate=10r/m;
#   limit_req_status 429;
#   limit_conn_zone $st_ipkey zone=st_rh_conn:10m;
# NOTE: if another proxy (Cloudflare) sits in front of nginx, enable ngx_http_realip_module
#   (set_real_ip_from <CF ranges>; real_ip_header CF-Connecting-IP;) so $remote_addr is the client, not the proxy. Never trust a
#   client-supplied X-Forwarded-For: below it is OVERWRITTEN with $remote_addr (not $proxy_add_x_forwarded_for), so the relayer's
#   "first XFF value" is always the address nginx saw.

# relay POSTs (withdraw, pay): strict
location ~ ^/stealth-api/rh/relay(/pay)?$ {
    limit_except POST { deny all; }
    limit_req zone=st_rh_post burst=5 nodelay;
    limit_conn st_rh_conn 10;
    client_max_body_size 8k;
    client_body_timeout 10s;
    rewrite ^/stealth-api/rh/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3884;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;                 # relayer does ~8 RPC calls before it answers; tx hash is returned right after send
    proxy_next_upstream off;                # NEVER retry a POST on another attempt
    add_header Cache-Control "no-store" always;
}

# relayer stats, sanctions pre-check (GET /stealth-api/rh/relay/screen?addr=0x.. -> {"addr","listed"}) and replaced-tx follow-up (GET /stealth-api/rh/relay/status?hash=0x.. -> {"hash","status"})
location ~ ^/stealth-api/rh/relay/(stats|screen|status)$ {
    limit_except GET { deny all; }
    limit_req zone=st_rh_read burst=40 nodelay;
    limit_conn st_rh_conn 10;               # audit 1099 M-2
    proxy_hide_header Cache-Control;        # audit 1102 I-2: one Cache-Control only (the location's own)
    rewrite ^/stealth-api/rh/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3884;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

# audit 1107 I-2: the sanctions list has its OWN location: the relayer's "public, max-age=300" reaches the browser (no hide_header / no-store here), so 5-minute caching works.
# st_rh_read still limits it; nginx may additionally cache it for the same 5 minutes (proxy_cache with a zone defined at http{} level) if the relayer load matters.
location = /stealth-api/rh/relay/sanctions-list {
    limit_except GET { deny all; }
    limit_req zone=st_rh_read burst=40 nodelay;
    limit_conn st_rh_conn 10;
    rewrite ^/stealth-api/rh/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3884;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# immutable history pages written by the indexer (STEALTH_PAGES_DIR). Python never serves these: nginx only, precompressed .gz next to each file.
# Page files are never edited in place (a reorg rewrite bumps manifest "version"; the client appends ?v=<version>), hence "immutable".
location = /stealth-api/rh/pages/manifest.json {
    alias /opt/stealth/data-rh/pages/manifest.json;
    limit_except GET { deny all; }
    default_type application/json;
    add_header Cache-Control "public, max-age=5" always;
}
location /stealth-api/rh/pages/ {
    alias /opt/stealth/data-rh/pages/;
    limit_except GET { deny all; }
    default_type application/json;
    gzip_static on;                             # serves p000001.json.gz when the client sends Accept-Encoding: gzip
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# the history tail (rows after the last full page) is the only bulk thing Python still serves: 1 s micro-cache so 500 scanners cost ONE upstream hit/s.
#   http{}:  proxy_cache_path /var/cache/nginx/stealth_tail levels=1 keys_zone=st_tail:2m max_size=64m inactive=1m use_temp_path=off;
location = /stealth-api/rh/announcements {
    limit_except GET { deny all; }
    limit_req zone=st_rh_read burst=40 nodelay;
    rewrite ^/stealth-api/rh/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3883;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache st_tail;
    proxy_cache_key $uri$is_args$args;
    proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_503;
    gzip on; gzip_types application/json; gzip_min_length 1024;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
}
# indexer reads (head, announcements, known, balances, receipt, usdc-domain)
location ~ ^/stealth-api/rh/(head|known|balances|receipt|usdc-domain)$ {
    limit_except GET { deny all; }
    limit_req zone=st_rh_read burst=40 nodelay;
    limit_conn st_rh_conn 20;
    rewrite ^/stealth-api/rh/(.*)$ /stealth-api/$1 break;
    proxy_pass http://127.0.0.1:3883;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    proxy_next_upstream error timeout http_503;   # idempotent GETs only
    proxy_next_upstream_tries 2;
    add_header Cache-Control "no-store" always;
}

# anything else under /stealth-api/rh/ is not an API
location /stealth-api/rh/ { return 404; }
